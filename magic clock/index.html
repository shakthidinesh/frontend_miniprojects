<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>magic clock</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
        box-sizing: border-box;
      }
      body {
        height: 100vh;
        /* background:url('https://media3.giphy.com/media/v1.Y2lkPTc5MGI3NjExdTBvN204ZXJ4a21sam43MDRjOXlndmpueW03MDd6Y203bTFsaGI1NiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/aRZ4vTsHnyW6A/giphy.webp'); */
        background-color: #0f172a;
        background-repeat: no-repeat;
        background-size: cover;
        /* background-position: ; */
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .clock {
        padding: 60px 100px;
        
        color:#0ff;
        background-color: rgba(255,255,255,0.05);
        border-radius: 25px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow:0 0 10px #0ff,0 0 20px #0ff,0 0 30px #0ff,0 0 40px #0ff;
        animation: glow 1.5s infinite alternate;
        ;
      }


      #time{
        font-size: 60px;
        letter-spacing: 10px;
        text-shadow: 0 0 5px #0ff;
      }
      #ampm{
        margin-left: 10px;
         font-size: 60px;
        letter-spacing: 10px;
        text-shadow: 0 0 5px #0ff;
      }
      /* key-frames for glow animation */
      @keyframes glow{
        0%{box-shadow: 0 0 30px #0ff;}
        25%{box-shadow: 0 0 35px #0ff;}
        50%{box-shadow:0 0 40px #0ff;}
        75%{box-shadow:0 0 45px #0ff}
        100%{box-shadow:0 0 50px #0ff;}
      }
    </style>
  </head>
  <body>
    <div class="clock">
      <h1 id="time">00:00:00</h1>
      <p id="ampm">AM</p>
    </div>

    <script>
        function updateTime(){
            const currentTime=new Date();
            let hours=currentTime.getHours();
            let minutes=currentTime.getMinutes();
            let seconds=currentTime.getSeconds();
            let amPm=(hours>=12)?"PM":"AM";

            document.getElementById("time").textContent=`${hours}:${minutes}:${seconds}`;
            document.getElementById("ampm").textContent=`${amPm}`;

        }
        setInterval(()=>{
            updateTime();
        },1000)
    </script>
  </body>
</html>
